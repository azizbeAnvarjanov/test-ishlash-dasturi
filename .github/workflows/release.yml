name: Publish Windows updates

on:
  workflow_dispatch:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  publish:
    runs-on: windows-latest
    env:
      GH_TOKEN: ${{ secrets.UPDATES_TOKEN }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - name: Verify tag and package versions
        shell: pwsh
        run: |
          $tagVersion = "${{ github.ref_name }}" -replace '^v', ''
          $serverVersion = (Get-Content apps/server/package.json | ConvertFrom-Json).version
          $studentVersion = (Get-Content apps/student/package.json | ConvertFrom-Json).version
          if ("${{ github.ref_type }}" -eq "tag" -and $tagVersion -ne $serverVersion) { throw "Tag $tagVersion va Server $serverVersion mos emas" }
          if ($serverVersion -ne $studentVersion) { throw "Server va Student versiyalari bir xil bo'lishi kerak" }
      - name: Verify update repositories
        shell: pwsh
        run: |
          $headers = @{
            Authorization = "Bearer $env:GH_TOKEN"
            Accept = "application/vnd.github+json"
            "X-GitHub-Api-Version" = "2022-11-28"
          }
          foreach ($repo in @("test-server-updates", "test-student-updates")) {
            $info = Invoke-RestMethod -Headers $headers -Uri "https://api.github.com/repos/azizbeAnvarjanov/$repo"
            if (-not $info.default_branch) { throw "$repo repository bo'sh: avval main branch yarating" }
          }
      - run: npm run typecheck
      - name: Build Server installer
        run: npm run dist:server
      - name: Build Student installer
        run: npm run dist:student
      - name: Publish Server update
        shell: pwsh
        run: |
          $version = (Get-Content apps/server/package.json | ConvertFrom-Json).version
          $tag = "v$version"
          $repo = "azizbeAnvarjanov/test-server-updates"
          $target = (gh api "repos/$repo/git/ref/heads/main" --jq '.object.sha')
          $releaseId = gh api "repos/$repo/releases/tags/$tag" --jq '.id' 2>$null
          if ($LASTEXITCODE -ne 0) { $releaseId = $null }
          if (-not $releaseId) {
            gh release create $tag --repo $repo --target $target --title $version --notes "Test Server $version avtomatik yangilanishi"
            if ($LASTEXITCODE -ne 0) {
              Write-Warning "Release yaratish javobi muvaffaqiyatsiz. Mavjud release qayta tekshirilmoqda."
            }
            $releaseId = gh api "repos/$repo/releases/tags/$tag" --jq '.id' 2>$null
            if ($LASTEXITCODE -ne 0 -or -not $releaseId) { throw "Server $tag release yaratilmadi yoki topilmadi" }
          }
          $releaseId = "$releaseId".Trim()
          $files = @(
            "apps/server/release/Easy-Testing-Server-Setup-$version.exe",
            "apps/server/release/Easy-Testing-Server-Setup-$version.exe.blockmap",
            "apps/server/release/latest.yml"
          )
          foreach ($file in $files) {
            $name = Split-Path $file -Leaf
            $assetIds = gh api "repos/$repo/releases/$releaseId/assets" --paginate --jq ".[] | select(.name == `"$name`") | .id"
            foreach ($assetId in $assetIds) {
              gh api --method DELETE "repos/$repo/releases/assets/$assetId"
            }
            $uploaded = $false
            for ($attempt = 1; $attempt -le 3; $attempt++) {
              gh release upload $tag $file --repo $repo
              if ($LASTEXITCODE -eq 0) { $uploaded = $true; break }
              Write-Warning "$name yuklanmadi. $attempt/3 urinish."
              Start-Sleep -Seconds (5 * $attempt)
            }
            if (-not $uploaded) { throw "$name uch urinishda ham yuklanmadi" }
          }
      - name: Publish Student update
        shell: pwsh
        run: |
          $version = (Get-Content apps/student/package.json | ConvertFrom-Json).version
          $tag = "v$version"
          $repo = "azizbeAnvarjanov/test-student-updates"
          $target = (gh api "repos/$repo/git/ref/heads/main" --jq '.object.sha')
          $releaseId = gh api "repos/$repo/releases/tags/$tag" --jq '.id' 2>$null
          if ($LASTEXITCODE -ne 0) { $releaseId = $null }
          if (-not $releaseId) {
            gh release create $tag --repo $repo --target $target --title $version --notes "Test Student $version avtomatik yangilanishi"
            if ($LASTEXITCODE -ne 0) {
              Write-Warning "Release yaratish javobi muvaffaqiyatsiz. Mavjud release qayta tekshirilmoqda."
            }
            $releaseId = gh api "repos/$repo/releases/tags/$tag" --jq '.id' 2>$null
            if ($LASTEXITCODE -ne 0 -or -not $releaseId) { throw "Student $tag release yaratilmadi yoki topilmadi" }
          }
          $releaseId = "$releaseId".Trim()
          $files = @(
            "apps/student/release/Easy-Testing-Student-Setup-$version.exe",
            "apps/student/release/Easy-Testing-Student-Setup-$version.exe.blockmap",
            "apps/student/release/latest.yml"
          )
          foreach ($file in $files) {
            $name = Split-Path $file -Leaf
            $assetIds = gh api "repos/$repo/releases/$releaseId/assets" --paginate --jq ".[] | select(.name == `"$name`") | .id"
            foreach ($assetId in $assetIds) {
              gh api --method DELETE "repos/$repo/releases/assets/$assetId"
            }
            $uploaded = $false
            for ($attempt = 1; $attempt -le 3; $attempt++) {
              gh release upload $tag $file --repo $repo
              if ($LASTEXITCODE -eq 0) { $uploaded = $true; break }
              Write-Warning "$name yuklanmadi. $attempt/3 urinish."
              Start-Sleep -Seconds (5 * $attempt)
            }
            if (-not $uploaded) { throw "$name uch urinishda ham yuklanmadi" }
          }
